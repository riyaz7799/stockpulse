services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_STOCK_API_KEY: ${VITE_STOCK_API_KEY:-}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
        VITE_POLL_INTERVAL_MS: ${VITE_POLL_INTERVAL_MS:-10000}
    ports:
      - "8080:80"
    restart: unless-stopped
